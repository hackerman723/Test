<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speech to Text</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Speech to Text Transcription</h1>
      <p>Transcribe spoken words into text in US or Indian English accents.</p>
    </header>

    <main class="container">
      <section class="controls">
        <div class="control-group">
          <label for="language">Recognition accent</label>
          <select id="language">
            <option value="en-US">English (United States)</option>
            <option value="en-IN">English (India)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="continuous">
            <input type="checkbox" id="continuous" checked />
            Continuous recognition
          </label>
        </div>

        <div class="control-buttons">
          <button id="start" class="primary">Start listening</button>
          <button id="stop" class="secondary" disabled>Stop</button>
          <button id="clear" class="ghost">Clear transcript</button>
        </div>
      </section>

      <section class="transcript-section">
        <h2>Transcript</h2>
        <textarea id="transcript" rows="10" placeholder="Transcript will appear here" readonly></textarea>
        <div class="transcript-actions">
          <button id="copy" class="ghost">Copy to clipboard</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
      </section>
    </main>

    <footer>
      <p>
        For best results, use a modern Chromium-based browser with microphone access
        granted.
      </p>
    </footer>

    <template id="no-support">
      <div class="unsupported">
        <h2>Your browser does not support speech recognition.</h2>
        <p>
          Try using the latest version of Chrome, Edge, or another browser with the Web
          Speech API enabled.
        </p>
      </div>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
